# Конфиг OpenOCD для STM32F103C8T6 через CMSIS-DAP.
# Скорость SWD снижена до 100 kHz. (1000 kHz значение по умолчанию)
#
# ВАЖНО: этот файл подключается в launch.json как ЕДИНСТВЕННЫЙ configFiles,
# поэтому interface/target/source здесь. Если добавить их ещё и в
# launch.json - OpenOCD упадёт с "target 'stm32f1x' already exists".

source [find interface/cmsis-dap.cfg]
source [find target/stm32f1x.cfg]

adapter speed 1000